# ─────────────────────────────────────────────────────────────
#  Списък с продукти за следене
# ─────────────────────────────────────────────────────────────
#
#  Поддържани магазини: technomarket.bg, technopolis.bg
#  (магазинът се разпознава по линка).
#
#  Всеки продукт има:
#    url           – линк към продукта
#    category      – твоя категория (свободен текст, по нея се групира в сайта)
#    target_price  – желана цена в EUR. Когато цената стане <= на нея,
#                    идва съобщение в Slack. Махни реда, ако не искаш известия.
#    name          – (по избор) твое име; иначе се взима от сайта
#    active        – (по избор) false = спира проверката, историята се пази
# ─────────────────────────────────────────────────────────────

settings:
  # true  = известие всеки ден, докато цената е под целта
  # false = известие само когато цената падне под целта или поевтинее още
  repeat_alerts_daily: false
  # Да праща ли в Slack съобщение, ако някой линк не може да бъде прочетен
  notify_on_errors: true
  # Пауза между заявките към сайта (секунди)
  request_delay: 3

