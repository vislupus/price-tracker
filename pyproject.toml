[project]
name = "technopolis-price-tracker"
version = "2.0.0"
description = "Ежедневно следене на цени в Технополис със SQLite, Slack известия и графики в GitHub Pages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13",
    "curl-cffi>=0.13",
    "pyyaml>=6.0",
    "requests>=2.32",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
