name: Публикуване на сайта

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # последният commit в main – включително току-що записаната база
          ref: ${{ github.event.repository.default_branch }}

      - name: Сглобяване на сайта
        run: |
          mkdir -p _site/data
          cp -r docs/. _site/
          cp data/prices.db _site/data/prices.db

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
